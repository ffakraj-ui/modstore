name: Update site (auto, every 5 days)
on:
  schedule:
    - cron: '0 2 */5 * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['build.py', 'appteka_fetch.py', 'assets/**']
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch fresh app data (new download tokens)
        run: python3 appteka_fetch.py --refresh
      - name: Build site
        run: |
          SITE_URL="${{ vars.SITE_URL }}"
          if [ -z "$SITE_URL" ]; then SITE_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"; fi
          python3 build.py --domain "$SITE_URL"
      - name: Save ids.json if changed
        run: |
          git config user.name "modstore-bot"; git config user.email "bot@users.noreply.github.com"
          git add data/ids.json
          git diff --cached --quiet || (git commit -m "Update app ids" && git push)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
